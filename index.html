<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bookstore POS</title><link rel=manifest href=/manifest.json><link rel=icon href=/icon.svg><meta name=theme-color content=#2e2a5a>
<style>
:root{--book:#4b3f8f;--cafe:#8a5a2b;--stat:#1f7a6c;--accent:var(--book);--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--sub:#6b6b6b;--line:#e3e3de;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:8px}
button,input,select,textarea{font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;min-height:44px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.sm{min-height:36px;padding:6px 10px;font-size:13px}
button.p,button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4}
label{display:flex;align-items:center;gap:6px;font-size:14px}
header.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:6}
header.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .stat{margin-left:auto;font-size:12px;opacity:.9;white-space:nowrap}
header.top button{background:#ffffff22;color:#fff;border-color:#ffffff44;min-height:36px;padding:7px 10px}
.desktop-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);margin:0}
nav.bottom{display:none}
@media(max-width:840px){
 .desktop-tabs{display:none}
 nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:12;padding-bottom:env(safe-area-inset-bottom)}
 nav.bottom button{flex:1;border:none;border-radius:0;background:transparent;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;min-height:58px}
 nav.bottom button.on{color:var(--accent);font-weight:700}
 body{padding-bottom:64px}
}
.wrap{max-width:1200px;margin:0 auto;padding:12px;display:grid;gap:12px}
.g{display:grid;grid-template-columns:1fr 380px;gap:12px}
@media(max-width:840px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.items button{text-align:left;min-height:78px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#00000088;display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:30}
@media(min-width:620px){.ov{align-items:center;padding:16px}}
.md{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:540px;max-height:92vh;overflow:auto;display:grid;gap:9px}
@media(min-width:620px){.md{border-radius:16px}}
.md .actions{position:sticky;bottom:-16px;background:#fff;margin:8px -16px -16px;padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.cartsheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
@media(max-width:840px){
 .cartsheet{position:fixed;left:0;right:0;bottom:64px;transform:translateY(calc(100% - 60px));transition:transform .22s ease;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px #00000022;z-index:11;border-bottom:none}
 .cartsheet.open{transform:translateY(0)}
 .cartsheet .peek{display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
 .cartsheet .sheetbody{padding:0 14px 14px}
}
@media(min-width:841px){.cartsheet .peek{display:none}.cartsheet .sheetbody{padding:14px}}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:700px){
 table.rtable thead{display:none}
 table.rtable,table.rtable tbody,table.rtable tr,table.rtable td{display:block;width:100%}
 table.rtable tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 10px}
 table.rtable td{border:none;display:flex;justify-content:space-between;gap:10px;padding:7px 0}
 table.rtable td::before{content:attr(data-label);font-weight:600;color:var(--sub)}
}
small{color:var(--sub)}.low{color:#b3261e;font-weight:700}.oos{opacity:.45}
.tag{font-size:11px;background:#eef0e8;border-radius:6px;padding:2px 6px}
.hint{font-size:12px;color:var(--sub)}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.denoms label{display:flex;flex-direction:column;gap:2px;font-size:12px;text-align:center}
.denoms input{width:100%;text-align:center;padding:8px 4px;min-height:40px}
</style></head><body><div id=app></div>
<script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js></script>
<script src=https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js></script>
<script src=https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js></script>
<script src=/config.js></script>
<script>
const C=window.CFG||{},sb=supabase.createClient(C.url,C.key),S={tab:'pos',dept:'book',cur:null,role:'cashier',q:'',d:new Date().toLocaleDateString('en-CA'),ret:'',cartOpen:false},R={},V={};let busy=0,PROFILES=[];
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),r2=n=>Math.round(n*100)/100,inr=n=>cfg().cur+r2(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){const v=a[x];if(v==null||v===false)continue;x.startsWith('on')?e[x]=v:x=='class'?e.className=v:e.setAttribute(x,v)}e.append(...k.flat().filter(x=>x!=null&&x!==false));return e};
const L=k=>Object.values(R).filter(r=>r.kind==k&&!r.deleted).map(r=>r.data),rec=id=>R[id]&&!R[id].deleted?R[id].data:null;
const cfg=()=>({name:'My Bookstore & Cafe',addr:'',phone:'',taxid:'',tax:5,ptsPer:100,prefix:'INV',cur:'₹',...(R.settings&&R.settings.data)}),can=x=>S.role=='owner'||(x=='m'&&S.role=='manager');
const DM={book:{label:'Books',accent:'var(--book)',gst:0},cafe:{label:'Cafe',accent:'var(--cafe)',gst:5},stat:{label:'Stationery',accent:'var(--stat)',gst:18}};
const DEPT_KIND={book:'book',cafe:'cafeitem',stat:'stationery'};
const DENOMS=[{v:2000,rare:true},{v:500},{v:200},{v:100},{v:50},{v:20},{v:10},{v:5},{v:2},{v:1}];
const normPhone=p=>(p||'').replace(/\D/g,'');
/* local store: rec = every record, out = unsent changes (keyed by id, latest wins, never dropped) */
const idb=new Promise(r=>{const q=indexedDB.open('bpos1',1);q.onupgradeneeded=()=>['rec','out','meta'].forEach(s=>q.result.createObjectStore(s,{keyPath:s=='meta'?'k':'id'}));q.onsuccess=()=>r(q.result)});
const tx=async(s,m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
async function save(kind,data,id=data.id||uid(),deleted=false){data.id=id;const r={id,kind,data,deleted,updated_at:now()};R[id]=r;await put('rec',r);await put('out',r);sync();return r}
async function setNote(){const n=(await all('out')).length,e=$('#net');if(e)e.textContent=(navigator.onLine?'Online':'Offline')+(n?' · '+n+' unsynced':' · synced')+' · '+S.role}
async function sync(){if(busy||!navigator.onLine||!S.user)return;busy=1;try{const{data:{session}}=await sb.auth.getSession();if(!session)throw 0;
 for(const r of await all('out')){const{error}=await sb.from('records').upsert({id:r.id,kind:r.kind,data:r.data,deleted:r.deleted});if(error)throw error;const c=await get('out',r.id);if(c&&c.updated_at==r.updated_at)await del('out',r.id)}
 const since=((await get('meta','since'))||{}).v||'1970-01-01T00:00:00Z',{data,error}=await sb.from('records').select('id,kind,data,deleted,updated_at').gte('updated_at',since).order('updated_at').limit(1000);if(error)throw error;let ch=0;
 for(const r of data){if(await get('out',r.id)||(R[r.id]&&R[r.id].updated_at==r.updated_at))continue;R[r.id]=r;await put('rec',r);ch++}
 if(data.length)await put('meta',{k:'since',v:data[data.length-1].updated_at});if(ch&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render();if(data.length>=1000)setTimeout(sync,500)}catch(e){console.warn('sync',e)}busy=0;setNote()}
/* money: per-line GST (books 0%, cafe/stationery each carry their own gst%) */
function tot(o){const lineNets=o.lines.map(l=>r2(l.price*l.qty*(1-(l.disc||0)/100)));const sub=r2(lineNets.reduce((a,b)=>a+b,0));
 const d=o.disc?r2(Math.min(sub,o.disc.t=='%'?sub*o.disc.v/100:o.disc.v)):0;const ratio=sub?(sub-d)/sub:1;
 let tax=0;const byRate={};o.lines.forEach((l,i)=>{const net=lineNets[i]*ratio,g=l.gst||0,t=r2(net*g/100);tax=r2(tax+t);byRate[g]=r2((byRate[g]||0)+t)});
 const total=r2(sub-d+tax);return{sub,d,tax,total,byRate}}
function nextNo(){const n=(+localStorage.n||0)+1;localStorage.n=n;const dv=localStorage.dev||(localStorage.dev=Math.random().toString(36).slice(2,4).toUpperCase());return cfg().prefix+'-'+dv+'-'+String(n).padStart(4,'0')}
const newOrder=()=>({id:uid(),lines:[],status:'cart',type:'sale',created:now(),by:S.user.id,cust:{}});
async function persist(){const o=S.cur;if(!o.no)o.no=nextNo();o.t=tot(o);await save('order',o,o.id)}
/* printing: 80mm thermal receipt + A4 formal invoice + barcode/QR labels, via an offscreen print-iframe */
function prn(html){const f=h('iframe',{style:'position:fixed;width:0;height:0;border:0'});document.body.append(f);const d=f.contentDocument;d.write('<style>body{font:12px monospace;width:72mm;margin:0}td{padding:1px 0}.r{text-align:right}</style>'+html);d.close();f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),3000)}
function prnA4(html){const f=h('iframe',{style:'position:fixed;width:0;height:0;border:0'});document.body.append(f);const d=f.contentDocument;d.write('<style>@page{size:A4;margin:14mm}body{font:13px sans-serif}table{border-collapse:collapse;width:100%}td,th{padding:4px;border:1px solid #ccc}</style>'+html);d.close();f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),3000)}
function rcpt(o){const s=cfg(),t=o.t;return `<b>${esc(s.name)}</b><br>${esc(s.addr)} ${esc(s.phone)}${s.taxid?'<br>Tax ID '+esc(s.taxid):''}<hr>${o.no}${o.type=='return'?' (RETURN, ref '+esc(o.refNo)+')':''} · ${new Date(o.paidAt||o.created).toLocaleString()}<br>${esc((o.cust||{}).name)} ${esc((o.cust||{}).phone)}<hr><table width=100%>${o.lines.map(l=>`<tr><td>${l.qty}x ${esc(l.name)}<br><small>${(DM[l.dept]||{}).label||l.dept}${l.gst?' · GST '+l.gst+'%':''}</small></td><td class=r>${r2(l.price*l.qty*(1-(l.disc||0)/100))}</td></tr>`).join('')}</table><hr>Subtotal ${t.sub}<br>${t.d?'Discount -'+t.d+'<br>':''}${Object.entries(t.byRate||{}).map(([rt,a])=>a?'GST '+rt+'%: '+a+'<br>':'').join('')}<b>Total ${t.total}</b><br>${o.type=='return'?'Refunded '+(o.pays||[]).map(p=>p.m+' '+Math.abs(p.amt)).join(', '):'Paid '+(o.pays||[]).map(p=>p.m+' '+p.amt).join(', ')}<br>Thank you!`}
function inv(o){const s=cfg(),t=o.t;return `<div><h2>${esc(s.name)}</h2><div>${esc(s.addr)} ${esc(s.phone)}${s.taxid?' · GSTIN '+esc(s.taxid):''}</div><hr>
<div>Invoice <b>${o.no}</b> &nbsp; ${new Date(o.paidAt||o.created).toLocaleString()}</div>
<div>Bill to: ${esc((o.cust||{}).name||'Walk-in')} ${esc((o.cust||{}).phone||'')}</div><br>
<table><tr><th>Item</th><th>Dept</th><th>Qty</th><th>Rate</th><th>Disc%</th><th>GST%</th><th>Amount</th></tr>
${o.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${(DM[l.dept]||{}).label||l.dept}</td><td>${l.qty}</td><td>${r2(l.price)}</td><td>${l.disc||0}</td><td>${l.gst||0}</td><td>${r2(l.price*l.qty*(1-(l.disc||0)/100))}</td></tr>`).join('')}
</table><br>
<table style="max-width:320px;margin-left:auto"><tr><td>Subtotal</td><td>${t.sub}</td></tr>${t.d?`<tr><td>Discount</td><td>-${t.d}</td></tr>`:''}
${Object.entries(t.byRate||{}).map(([rt,a])=>`<tr><td>GST ${rt}%</td><td>${a}</td></tr>`).join('')}
<tr><td><b>Total</b></td><td><b>${t.total}</b></td></tr></table>
<br><div>Paid: ${(o.pays||[]).map(p=>p.m+' '+p.amt).join(', ')||'-'}</div><div>Thank you for your business!</div></div>`}
function wa(o){let p=((o.cust||{}).phone||prompt('Customer phone')||'').replace(/\D/g,'');if(!p)return;if(p.length==10)p='91'+p;open('https://wa.me/'+p+'?text='+encodeURIComponent(`Thanks for visiting ${cfg().name}!\nBill ${o.no}\n`+o.lines.map(l=>`${l.qty}x ${l.name}: ${inr(l.price*l.qty)}`).join('\n')+`\nTotal: ${inr(o.t.total)}`),'_blank')}
function modal(...k){const o=h('div',{class:'ov',onclick:e=>e.target==o&&o.remove()},h('div',{class:'md'},...k));document.body.append(o);return()=>o.remove()}
function genCode(prefix){return prefix+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase()}
function printBarcode(code,title){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');JsBarcode(svg,code,{format:'CODE128',width:2,height:40,displayValue:true,fontSize:12,margin:4});prn(`<div style="width:50mm;text-align:center"><div style="font:11px sans-serif">${esc(title||'')}</div>${svg.outerHTML}</div>`)}
function tableQRUrl(t){return location.origin+'/?order=1&t='+encodeURIComponent(t.id)+'&tn='+encodeURIComponent(t.name)}
function printTableQR(t){const url=tableQRUrl(t),cv=document.createElement('canvas');QRCode.toCanvas(cv,url,{width:200,margin:1},()=>{prn(`<div style="width:60mm;text-align:center"><div style="font:14px sans-serif;font-weight:700">${esc(t.name)}</div><img src="${cv.toDataURL()}" width=200><div style="font:10px monospace;word-break:break-all">${esc(url)}</div></div>`)})}
/* selling */
function addLine(dept,id,name,price,gst){const o=S.cur;const l=o.lines.find(x=>x.dept==dept&&x.id==id);l?l.qty++:o.lines.push({dept,id,name,price,gst:gst||0,qty:1,disc:0});render()}
function scan(val){val=(val||'').trim();if(!val)return;
 const b=L('book').find(x=>x.isbn&&x.isbn==val);if(b){if((b.stock||0)<=0&&!can('m'))return alert('Out of stock: '+b.title);return addLine('book',b.id,b.title,b.price,0)}
 const s=L('stationery').find(x=>x.sku&&x.sku==val);if(s){if((s.stock||0)<=0&&!can('m'))return alert('Out of stock: '+s.name);return addLine('stat',s.id,s.name,s.price,s.gst||0)}
 alert('No item found for barcode "'+val+'"')}
function qty(l,d){l.qty+=d;if(l.qty<=0)S.cur.lines=S.cur.lines.filter(x=>x!==l);render()}
function lineDisc(l){const v=prompt('Line discount %',l.disc||0);if(v==null)return;l.disc=Math.max(0,Math.min(100,+v||0));render()}
function denomPicker(onChange){const vals={};const grid=h('div',{class:'denoms'},...DENOMS.map(d=>{const inp=h('input',{type:'number',min:0,placeholder:'0',oninput:e=>{vals[d.v]=Math.max(0,+e.target.value||0);onChange(sum())}});return h('label',{},'₹'+d.v+(d.rare?' *':''),inp)}));
 function sum(){return DENOMS.reduce((a,d)=>a+(vals[d.v]||0)*d.v,0)}
 return{el:grid,sum,vals}}
async function applyLoyalty(o,cust,phone,redeemPts){if(!phone)return;const c=cust?{...cust}:{id:phone,name:o.cust.name||'',phone,points:0,credit:0};
 const earn=Math.floor(o.t.total/(cfg().ptsPer||100));c.points=Math.max(0,(c.points||0)+earn-(redeemPts||0));
 const spent=(o.pays||[]).filter(p=>p.m=='credit').reduce((a,p)=>a+p.amt,0);c.credit=Math.max(0,(c.credit||0)-spent);c.name=o.cust.name||c.name;
 await save('customer',c,phone)}
function custModal(o){const phone=normPhone(o.cust.phone);if(!phone)return alert('Enter a phone number first');let c=rec(phone)||{id:phone,name:o.cust.name||'',phone,points:0,credit:0};
 const hist=L('order').filter(x=>x.status=='paid'&&normPhone((x.cust||{}).phone)==phone).sort((a,b)=>b.paidAt>a.paidAt?1:-1).slice(0,15);
 const adjAmt=h('input',{type:'number',placeholder:'Amount'}),adjNote=h('input',{placeholder:'Reason (e.g. return credit)'});
 const x=modal(h('h3',{},esc(c.name||'Customer')+' · '+phone),h('div',{},'Points: '+(c.points||0)+' · Store credit: '+inr(c.credit||0)),
  can('m')?h('div',{class:'row'},adjAmt,adjNote,h('button',{class:'sm',onclick:async()=>{const a=+adjAmt.value;if(!a)return;c.credit=r2((c.credit||0)+a);c.name=c.name||o.cust.name||'';await save('customer',c,phone);x();render()}},'Add credit')):null,
  h('h4',{},'Recent purchases'),...hist.map(hh=>h('div',{class:'row'},hh.no+' · '+new Date(hh.paidAt).toLocaleDateString(),inr(hh.t.total))),!hist.length?h('p',{},'No past purchases.'):null,
  h('div',{class:'actions'},h('button',{onclick:x},'Close')))}
function pay(){const o=S.cur;if(!o.lines.length)return;o.t=tot(o);
 let redeemPts=0,changeVals={};const phone=normPhone(o.cust.phone),cust=phone?rec(phone):null;const P=[];
 const due=()=>r2(o.t.total-redeemPts-P.reduce((a,x)=>a+x.amt,0));
 const amt=h('input',{type:'number',value:o.t.total});
 const useDenom=h('input',{type:'checkbox'});
 const cdw=h('div',{style:'display:none'});
 const cashDenom=denomPicker(s=>{amt.value=s});
 useDenom.onchange=()=>{cdw.style.display=useDenom.checked?'block':'none';cdw.replaceChildren(cashDenom.el)};
 const custRow=h('div',{class:'row'},cust?('Customer: '+esc(cust.name||phone)+' · pts '+(cust.points||0)+' · credit '+inr(cust.credit||0)):(phone?'New customer':'No phone on order'));
 const redeemRow=cust&&cust.points>0?h('div',{class:'row'},h('input',{type:'number',id:'rdp',placeholder:'Redeem points (1pt=₹1)',style:'width:170px'}),h('button',{class:'sm',onclick:()=>{redeemPts=Math.max(0,Math.min(cust.points,+$('#rdp').value||0));up()}},'Apply')):null;
 const list=h('div');const info=h('b');const changeSec=h('div');
 const up=()=>{list.replaceChildren(...P.map((p,i)=>h('div',{class:'row'},p.m.toUpperCase()+' '+inr(p.amt),h('button',{class:'sm',onclick:()=>{P.splice(i,1);up()}},'x'))));
  const dv=due();info.textContent=dv>0?'Due '+inr(dv):'Change to return '+inr(-dv);amt.value=Math.max(dv,0);done.disabled=dv>0;
  changeSec.replaceChildren();if(dv<0){const chg=denomPicker(()=>{changeVals=chg.vals});changeVals=chg.vals;changeSec.append(h('p',{},'Record change given back:'),chg.el)}};
 const addPay=m=>{let a=(m=='cash'&&useDenom.checked)?cashDenom.sum():+amt.value;if(!(a>0))return;
  if(m=='credit'){a=Math.min(a,due(),(cust&&cust.credit)||0);if(a<=0)return alert('No store credit available for this customer')}
  else if(m!='cash')a=Math.min(a,due());
  if(a<=0)return;P.push({m,amt:a});up()};
 const done=h('button',{class:'p',disabled:true,onclick:async()=>{o.pays=P;o.redeemPts=redeemPts;o.change=Math.max(-due(),0);o.changeDenoms=changeVals;o.status='paid';o.paidAt=now();
  await persist();await adjustStock(o,-1);await applyLoyalty(o,cust,phone,redeemPts);x();prn(rcpt(o));S.cur=null;S.cartOpen=false;render()}},'Complete and print');
 const x=modal(h('h3',{},'Pay '+inr(o.t.total)),custRow,redeemRow,amt,h('label',{},useDenom,' Cash — count by denomination'),cdw,
  h('div',{class:'row'},...['cash','upi','card','credit'].map(m=>h('button',{onclick:()=>addPay(m)},m.toUpperCase()))),
  list,info,changeSec,h('div',{class:'actions'},done,h('button',{onclick:x},'Cancel')));

function parseCSV(text){const rows=[];let row=[],cur='',q=false;text=text.replace(/\r\n/g,'\n');

  else{if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}

 rows.forEach((r,i)=>{try{
  if(dept=='book'){if(!r.title)throw'row '+(i+2)+': missing title';
   let catId=catByName[(r.category||'').toLowerCase()];if(!catId&&r.category){catId='new:'+r.category;if(!newCats.includes(r.category))newCats.push(r.category)}
   const match=r.isbn&&existing.find(b=>b.isbn==r.isbn);
   const row={title:r.title,author:r.author||'',publisher:r.publisher||'',isbn:r.isbn||'',catId,cost:+r.cost_price||0,price:+r.sell_price||0,stock:+r.stock||0,reorder:(r.reorder_level===''||r.reorder_level==null)?null:+r.reorder_level};
   (match?toUpdate:toAdd).push({row,match})}

   let catId=catByName[(r.category||'').toLowerCase()];if(!catId&&r.category){catId='new:'+r.category;if(!newCats.includes(r.category))newCats.push(r.category)}
   const match=existing.find(x=>x.name.toLowerCase()==r.name.toLowerCase()&&catNameOf(x.cat).toLowerCase()==(r.category||'').toLowerCase());
   const row={name:r.name,catId,price:+r.price||0,cost:+r.cost_price||0,gst:(r.gst_percent===''||r.gst_percent==null)?DM[dept].gst:+r.gst_percent,track:dept=='stat'?true:/^(y|yes|true|1)$/i.test(r.track_stock||''),stock:+r.stock||0,reorder:(r.reorder_level===''||r.reorder_level==null)?null:+r.reorder_level};
   (match?toUpdate:toAdd).push({row,match})}

 if(error){alert('Could not send the order — check your connection and try again.');return}
 PUB.cart=[];PUB.note='';renderPublic();alert('Order sent to the counter! You can keep adding items.')}
function renderPublic(){const q=PUB.q.trim().toLowerCase();const items=PUB.items.filter(i=>q?i.name.toLowerCase().includes(q):i.cat==PUB.cat).sort((a,b)=>a.name.localeCompare(b.name));const total=r2(PUB.cart.reduce((a,l)=>a+l.price*l.qty,0));
 const menu=h('div',{class:'wrap'},
  h('div',{class:'row'},...PUB.cats.map(c=>h('button',{class:(c.id==PUB.cat&&!q)?'on sm':'sm',onclick:()=>{PUB.cat=c.id;PUB.q='';renderPublic()}},c.name))),
  h('input',{placeholder:'Search menu',value:PUB.q,oninput:e=>{PUB.q=e.target.value;renderPublic()}}),
  h('div',{class:'items'},...items.map(it=>h('button',{onclick:()=>pubAdd(it)},h('b',{},it.name),inr(it.price)))),items.length?null:h('p',{},'Nothing here yet.'),
  h('div',{class:'card'},h('h3',{},'Your order'),...PUB.cart.map(l=>h('div',{class:'row'},l.name,h('span',{},h('button',{class:'sm',onclick:()=>pubQty(l,-1)},'−'),' '+l.qty+' ',h('button',{class:'sm',onclick:()=>pubQty(l,1)},'+')),inr(l.price*l.qty))),
   PUB.cart.length?null:h('p',{},'Tap an item to add it.'),h('div',{class:'row'},h('b',{},'Total'),h('b',{},inr(total))),
   h('input',{placeholder:'Any notes for the counter? (optional)',value:PUB.note,oninput:e=>PUB.note=e.target.value}),
   h('button',{class:'p',disabled:!PUB.cart.length,onclick:pubSubmit},'Send order to counter')));
 $('#app').replaceChildren(h('header',{class:'top'},h('span',{class:'ttl'},esc(PUB.settings.name||'Menu')),h('span',{class:'stat'},esc(PUB.tableName))),menu)}
(function(){const p=new URLSearchParams(location.search);if(p.get('order')=='1'&&p.get('t')){bootPublic(p.get('t'),p.get('tn'))}else{boot()}})();
</script></body></html>
