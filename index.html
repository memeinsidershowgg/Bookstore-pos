/* money: GST-INCLUSIVE pricing. l.price is the final shelf/selling price the customer pays, GST already
   baked in -- a ₹5 pen with 18% GST is sold for ₹5, not ₹5.90. So a line's gross (what's charged) is
   price*qty*(1-disc%), and the GST amount for that line is EXTRACTED from the gross rather than added:
   taxable = gross/(1+gst%/100), tax = gross-taxable. `total` is therefore sub-d (never sub-d+tax --
   the tax is already inside sub). `tax`/`byRate`/`taxable` stay purely informational, for the GST
   breakdown on the invoice/reports and the CGST/SGST/IGST split below.
   CGST/SGST/IGST split (Part 3 #2): a bookstore till mostly sells to local walk-in customers, so the
   practical default is intra-state (CGST+SGST, half the combined rate each) -- IGST only applies to the
   rare inter-state sale, flagged per-order via o.interState (auto-set true when billing a B2B party whose
   state differs from the business's home state in Settings, and otherwise editable per-order in the cart
   for a manual override). */
function tot(o){const lineGross=o.lines.map(l=>r2(l.price*l.qty*(1-(l.disc||0)/100)));const sub=r2(lineGross.reduce((a,b)=>a+b,0));

   document.write so layout has actually run before print() fires, and cleaning up on the browser's own

function pubAdd(it){const l=PUB.cart.find(x=>x.id==it.id);l?l.qty++:PUB.cart.push({id:it.id,name:it.name,price:it.price,qty:1});renderPublic()}
function pubQty(l,d){l.qty+=d;if(l.qty<=0)PUB.cart=PUB.cart.filter(x=>x!==l);renderPublic()}
async function pubSubmit(){if(!PUB.cart.length)return;
 const{error}=await sb.from('records').insert({id:uid(),kind:'torder',data:{table:PUB.table,tableName:PUB.tableName,lines:PUB.cart,status:'pending',created:now(),note:PUB.note||''},deleted:false});
 if(error){alert('Could not send the order — check your connection and try again.');return}
 PUB.cart=[];PUB.note='';renderPublic();alert('Order sent to the counter! You can keep adding items.')}

 const menu=h('div',{class:'wrap'},
  h('div',{class:'row'},...PUB.cats.map(c=>h('button',{class:((c.id==PUB.cat&&!q)?'on sm':'sm')+' pill',onclick:()=>{PUB.cat=c.id;PUB.q='';renderPublic()}},c.name))),
  h('div',{class:'search-row'},icon('search',18),h('input',{placeholder:'Search menu',value:PUB.q,oninput:e=>{PUB.q=e.target.value;renderPublic()}})),
  h('div',{class:'items'},...items.map(it=>h('button',{onclick:()=>pubAdd(it)},h('b',{},it.name),h('span',{class:'price'},inr(it.price))))),items.length?null:h('p',{},'Nothing here yet.'),
  h('div',{class:'card'},h('h3',{},'Your order'),...PUB.cart.map(l=>h('div',{class:'row'},l.name,h('span',{},h('button',{class:'sm',onclick:()=>pubQty(l,-1)},'−'),' '+l.qty+' ',h('button',{class:'sm',onclick:()=>pubQty(l,1)},'+')),inr(l.price*l.qty))),
   PUB.cart.length?null:h('p',{class:'empty-hint'},'Tap an item to add it.'),h('div',{class:'row'},h('b',{},'Total'),h('b',{},inr(total))),
   h('input',{placeholder:'Any notes for the counter? (optional)',value:PUB.note,oninput:e=>PUB.note=e.target.value}),
   h('button',{class:'p cta',disabled:!PUB.cart.length,onclick:pubSubmit},'Send order to counter')));
 $('#app').replaceChildren(h('header',{class:'top'},h('span',{class:'ttl'},esc(PUB.settings.name||'Menu')),h('span',{class:'stat'},esc(PUB.tableName))),menu)}
/* public, no-login printable invoice: index.html?i=<shortCode> (or, for orders saved before short
   codes existed, ?inv=<orderId>) -- reached via the WhatsApp bill-share link. Anonymous, scoped to
   exactly one order (an unguessable code/UUID -- the same "anyone with the link" trust model as a
   typical shareable bill/receipt), via the anon_read_order policy below. */
async function bootInvoicePublic(id,byShort){$('#app').textContent='Loading invoice…';
 const q=sb.from('records').select('id,kind,data,deleted').eq('kind','order').eq('deleted',false);
 const{data,error}=await(byShort?q.eq('data->>short',id):q.eq('id',id)).maybeSingle();
 if(error||!data){$('#app').replaceChildren(h('div',{class:'wrap'},h('p',{},'Invoice not found or no longer available.')));return}
 const{data:setRows}=await sb.from('records').select('data').eq('kind','settings').eq('deleted',false);
 R.settings={data:(setRows&&setRows[0]&&setRows[0].data)||{}};
 const o=data.data,card=h('div',{class:'card'});card.innerHTML=inv(o);
 $('#app').replaceChildren(h('header',{class:'top'},h('span',{class:'ttl'},esc(cfg().name||'Invoice'))),
  h('div',{class:'wrap'},card,h('div',{class:'row'},h('button',{class:'p',onclick:()=>prnA4(inv(o))},'Print'))))}
(function(){const p=new URLSearchParams(location.search);if(p.get('order')=='1'&&p.get('t')){bootPublic(p.get('t'),p.get('tn'))}else if(p.get('i')){bootInvoicePublic(p.get('i'),true)}else if(p.get('inv')){bootInvoicePublic(p.get('inv'),false)}else{boot()}})();
