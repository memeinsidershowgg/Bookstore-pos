<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bookstore POS</title><link rel=manifest href=/manifest.json><link rel=icon href=/icon.svg><meta name=theme-color content=#2e2a5a>
<style>
:root{--book:#4b3f8f;--cafe:#8a5a2b;--stat:#1f7a6c;--accent:#141414;--rail:#141414;--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--sub:#6b6b6b;--line:#e3e3de;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:8px}
button,input,select,textarea{font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;min-height:44px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.sm{min-height:36px;padding:6px 10px;font-size:13px}
button.p,button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.4}
button.pill{border-radius:999px;padding:8px 16px}
button.pill.sm{padding:6px 13px}
label{display:flex;align-items:center;gap:6px;font-size:14px}
.ico{display:inline-flex;flex:none;align-items:center;justify-content:center;color:currentColor}
.ico svg{display:block;width:100%;height:100%}
header.top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:6}
header.top .ttl{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .stat{margin-left:auto;font-size:12px;opacity:.9;white-space:nowrap}
header.top button{background:#ffffff22;color:#fff;border-color:#ffffff44;min-height:36px;padding:7px 10px}
nav.rail{display:none}
nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:12;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:none;border-radius:0;background:transparent;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;min-height:58px}
nav.bottom button .ico{width:21px;height:21px}
nav.bottom button.on{color:var(--accent);font-weight:700}
body{padding-bottom:64px}
@media(min-width:1024px){
 nav.bottom{display:none}
 body{padding-bottom:8px;padding-left:68px}
 header.top{margin-left:68px}
 .wrap{margin-left:0}
 nav.rail{display:flex;flex-direction:column;align-items:center;gap:5px;position:fixed;left:0;top:0;bottom:0;width:68px;background:var(--rail);padding:14px 0;z-index:15;overflow-y:auto}
 nav.rail button{background:transparent;border:none;color:#ffffffa8;width:44px;height:44px;min-height:44px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center}
 nav.rail button .ico{width:22px;height:22px}
 nav.rail button.on{background:#ffffff20;color:#fff}
 nav.rail button:hover{background:#ffffff14}
}
.wrap{max-width:1200px;margin:0 auto;padding:12px;display:grid;gap:12px}
.g{display:grid;grid-template-columns:1fr 380px;gap:12px}
@media(max-width:840px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.items button{text-align:left;min-height:78px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#00000088;display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:30}
@media(min-width:620px){.ov{align-items:center;padding:16px}}
.md{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:540px;max-height:92vh;overflow:auto;display:grid;gap:9px}
@media(min-width:620px){.md{border-radius:16px}}
.md .actions{position:sticky;bottom:-16px;background:#fff;margin:8px -16px -16px;padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.cartsheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
@media(max-width:840px){
 .cartsheet{position:fixed;left:0;right:0;bottom:64px;transform:translateY(calc(100% - 60px));transition:transform .22s ease;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px #00000022;z-index:11;border-bottom:none}
 .cartsheet.open{transform:translateY(0)}
 .cartsheet .peek{display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
 .cartsheet .sheetbody{padding:0 14px 14px}
}
@media(min-width:841px){.cartsheet .peek{display:none}.cartsheet .sheetbody{padding:14px}}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:700px){
 table.rtable thead{display:none}
 table.rtable,table.rtable tbody,table.rtable tr,table.rtable td{display:block;width:100%}
 table.rtable tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:4px 10px}
 table.rtable td{border:none;display:flex;justify-content:space-between;gap:10px;padding:7px 0}
 table.rtable td::before{content:attr(data-label);font-weight:600;color:var(--sub)}
}
small{color:var(--sub)}.low{color:#b3261e;font-weight:700}.oos{opacity:.45}
.tag{font-size:11px;background:#eef0e8;border-radius:6px;padding:2px 6px}
.tag-book{background:#ece9f9;color:#4b3f8f}.tag-cafe{background:#f7ece0;color:#8a5a2b}.tag-stat{background:#e2f3f0;color:#1f7a6c}
.hint{font-size:12px;color:var(--sub)}
.empty-hint{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.denoms label{display:flex;flex-direction:column;gap:2px;font-size:12px;text-align:center}
.denoms input{width:100%;text-align:center;padding:8px 4px;min-height:40px}
.items .price{color:var(--sub);font-size:13px;font-weight:400}
.order-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.order-hd h3{text-transform:uppercase;letter-spacing:.07em;font-size:13px;font-weight:800;margin:0}
.order-hd small{color:var(--sub)}
.peek-lbl{display:flex;align-items:center;gap:8px}
.search-row{display:flex;align-items:center;gap:8px}
.search-row .ico{color:var(--sub)}
.search-row input{flex:1}
</style></head><body><div id=app></div>

const L=k=>Object.values(R).filter(r=>r.kind==k&&!r.deleted).map(r=>r.data),rec=id=>R[id]&&!R[id].deleted?R[id].data:null;

/* book rental deposit refund tiers -- returned sooner keeps a bigger share of the deposit.

function rentalRefundPct(days){if(days<=7)return.8;if(days<=30)return.7;if(days<=60)return.6;return 0}
/* per-prefix ticket numbering, separate counters so invoice numbering (key 'n') is untouched */
function ticketNo(counterKey,prefix){const n=(+localStorage[counterKey]||0)+1;localStorage[counterKey]=n;const dv=localStorage.dev||(localStorage.dev=Math.random().toString(36).slice(2,4).toUpperCase());return prefix+'-'+dv+'-'+String(n).padStart(4,'0')}
/* stock ledger: an append-only movement log per item, shown as a running total instead of a raw number */
async function logStock(dept,itemId,itemName,type,qty,note){await save('stockmove',{dept,itemId,itemName,type,qty,note:note||'',at:now(),by:(S.user&&S.user.id)||''})}

async function touchCustomer(phone,name){if(!phone)return;const c=rec(phone)||{id:phone,name:name||'',phone,points:0,credit:0,visits:0};c.visits=(c.visits||0)+1;c.lastVisit=now();if(name)c.name=name;await save('customer',c,phone);return c}
/* local store: rec = every record, out = unsent changes (keyed by id, latest wins, never dropped) */
const idb=new Promise(r=>{const q=indexedDB.open('bpos1',1);q.onupgradeneeded=()=>['rec','out','meta'].forEach(s=>q.result.createObjectStore(s,{keyPath:s=='meta'?'k':'id'}));q.onsuccess=()=>r(q.result)});

 for(const r of data){if(await get('out',r.id)||(R[r.id]&&R[r.id].updated_at==r.updated_at))continue;R[r.id]=r;await put('rec',r);ch++}

function rcpt(o){const s=cfg(),t=o.t;return `<b>${esc(s.name)}</b><br>${esc(s.addr)} ${esc(s.phone)}${s.taxid?'<br>Tax ID '+esc(s.taxid):''}<hr>${o.no}${o.type=='return'?' (RETURN, ref '+esc(o.refNo)+')':''} · ${new Date(o.paidAt||o.created).toLocaleString()}<br>${esc((o.cust||{}).name)} ${esc((o.cust||{}).phone)}<hr><table width=100%>${o.lines.map(l=>`<tr><td>${l.qty}x ${esc(l.name)}<br><small>${(DM[l.dept]||{}).label||l.dept}${l.gst?' · GST '+l.gst+'%':''}</small></td><td class=r>${r2(l.price*l.qty*(1-(l.disc||0)/100))}</td></tr>`).join('')}</table><hr>Subtotal ${t.sub}<br>${t.d?'Discount -'+t.d+'<br>':''}${Object.entries(t.byRate||{}).map(([rt,a])=>a?'GST '+rt+'%: '+a+'<br>':'').join('')}<b>Total ${t.total}</b><br>${o.type=='return'?'Refunded '+(o.pays||[]).map(p=>p.m+' '+Math.abs(p.amt)).join(', '):'Paid '+(o.pays||[]).map(p=>p.m+' '+p.amt).join(', ')}<br>Thank you!`}
function inv(o){const s=cfg(),t=o.t;return `<div><h2>${esc(s.name)}</h2><div>${esc(s.addr)} ${esc(s.phone)}${s.taxid?' · GSTIN '+esc(s.taxid):''}</div><hr>
<div>Invoice <b>${o.no}</b> &nbsp; ${new Date(o.paidAt||o.created).toLocaleString()}</div>

/* QR/barcode generation depends on the qrcode/jsbarcode CDN scripts loaded in <head>. If either script

   onclick — nothing printed and nothing visible happened, which is exactly what showed up as
   "Table QR is not working". Both entry points now check the global first and show a clear, actionable

function parseCSV(text){const rows=[];let row=[],cur='',q=false;text=text.replace(/\r\n/g,'\n');

  else{if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}
